<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Translator - បកប្រែរឿងនិទាន</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📖 AI Story Translator (ខ្មែរ)</h1>
        <p class="subtitle">ឧបករណ៍បកប្រែប្រលោមលោក និងរឿងនិទានដោយប្រើ AI</p>

        <div class="controls">
            <label for="source-lang">ភាសាដើម៖</label>
            <select id="source-lang">
                <option value="Auto-detect">ស្វែងរកអូតូ (Auto Detect)</option>
                <option value="English">អង់គ្លេស (English)</option>
                <option value="Chinese">ចិន (Chinese)</option>
                <option value="Thai">ថៃ (Thai)</option>
                <option value="Vietnamese">វៀតណាម (Vietnamese)</option>
            </select>
        </div>

        <div class="editor-container">
            <div class="box">
                <h3>អត្ថបទដើម</h3>
                <textarea id="input-text" placeholder="Paste សាច់រឿងដែលចង់បកប្រែនៅទីនេះ..."></textarea>
            </div>
            <div class="box">
                <h3>អត្ថបទបកប្រែរួច (ខ្មែរ)</h3>
                <textarea id="output-text" readonly placeholder="លទ្ធផលបកប្រែនឹងបង្ហាញនៅទីនេះ..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button id="translate-btn" onclick="translateStory()">🚀 ចាប់ផ្តើមបកប្រែ</button>
            <button id="copy-btn" onclick="copyResult()">📋 ចម្លងអត្ថបទ</button>
        </div>
        
        <div id="loading" class="hidden">កំពុងបកប្រែ... សូមរង់ចាំបន្តិច ⏳</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
