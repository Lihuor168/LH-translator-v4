<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer AI Video Dubbing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Siemreap', sans-serif, -apple-system;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            text-align: center;
        }

        .header-card h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .header-card p {
            font-size: 12px;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-badge {
            background: #2563eb;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .file-input-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            background: #f8fafc;
            text-align: center;
        }

        input[type="file"] {
            width: 100%;
            font-size: 13px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
            display: block;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            background-color: white;
            outline: none;
        }

        textarea {
            height: 180px;
            font-family: monospace;
            line-height: 1.5;
            resize: vertical;
        }

        .key-input-group {
            display: flex;
            gap: 8px;
        }

        .btn-add-key {
            background: #10b981;
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .key-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            max-height: 100px;
            overflow-y: auto;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .btn-del-key {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-success {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8 !important;
            cursor: not-allowed;
        }

        video {
            width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            background: #000;
        }

        .btn-download {
            background: #10b981;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>🎬 Khmer AI Video Dubbing</h1>
        <p>បកប្រែជាអត្ថបទ Timeline ➔ កែសម្រួល ➔ បង្កើតសំឡេងខ្មែរ</p>
    </div>

    <!-- STEP 1: Upload Video & Get Subtitle -->
    <div class="card">
        <div class="card-title">
            <span class="step-badge">ជំហានទី ១</span>
            <span>📤 Upload វីដេអូ & បកប្រែជា Timeline (SRT)</span>
        </div>

        <div>
            <label>ជ្រើសរើស File វីដេអូ</label>
            <div class="file-input-box">
                <input type="file" id="videoFile" accept="video/*" required>
            </div>
        </div>

        <div>
            <label>🌐 ភាសាដើម</label>
            <select id="sourceLang">
                <option value="English" selected>English (អង់គ្លេស)</option>
                <option value="Chinese">Chinese (ចិន)</option>
                <option value="Thai">Thai (ថៃ)</option>
                <option value="Korean">Korean (កូរ៉េ)</option>
            </select>
        </div>

        <div>
            <label>🎙️ ស្ទីលបកប្រែ</label>
            <select id="scriptStyle">
                <option value="សម្រាយរឿង YouTube" selected>សម្រាយរឿង YouTube</option>
                <option value="រឿងនិទាន">រឿងនិទាន</option>
                <option value="ព័ត៌មាន">ព័ត៌មាន</option>
            </select>
        </div>

        <div>
            <label>🔑 Groq API Keys</label>
            <div class="key-input-group">
                <input type="text" id="singleKeyInput" placeholder="gsk_...">
                <button type="button" class="btn-add-key" onclick="addKey()">➕ ថែម Key</button>
            </div>
            <div class="key-list" id="keyListDisplay"></div>
        </div>

        <button type="button" id="btnTranslate" class="btn-primary" onclick="step1Translate()">
            📝 1. ស្ដាប់សំឡេង & បង្កើតអត្ថបទ Timeline
        </button>
    </div>

    <!-- STEP 2: Review/Edit Text & Render Video -->
    <div class="card" id="step2Card" style="display: none;">
        <div class="card-title">
            <span class="step-badge" style="background: #10b981;">ជំហានទី ២</span>
            <span>📝 ពិនិត្យ/កែសម្រួល Timeline & បង្កើតសំឡេង</span>
        </div>

        <div>
            <label>អត្ថបទបកប្រែខ្មែរ (អាចកែប្រែពាក្យពេចន៍បាន)៖</label>
            <textarea id="khmerSrtText" placeholder="អត្ថបទ SRT នឹងបង្ហាញនៅទីនេះ..."></textarea>
        </div>

        <button type="button" id="btnDub" class="btn-success" onclick="step2DubVideo()">
            🎙️ 2. បង្កើតសំឡេង & បញ្ចូលក្នុងវីដេអូ
        </button>
    </div>

    <!-- RESULT SECTION -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">🎉 វីដេអូបកប្រែ និងបញ្ចូលសំឡេងរួចរាល់</div>
        <video id="videoPreview" controls></video>
        <a id="downloadBtn" class="btn-download" download="Dubbed_Khmer_Video.mp4">📥 ទាញយក File MP4</a>
    </div>
</div>

<script>
    let savedKeys = JSON.parse(localStorage.getItem('my_groq_key_array') || '[]');

    document.addEventListener('DOMContentLoaded', renderKeyList);

    function renderKeyList() {
        const display = document.getElementById('keyListDisplay');
        display.innerHTML = '';
        savedKeys.forEach((key, index) => {
            const maskedKey = key.substring(0, 8) + '...' + key.substring(key.length - 4);
            const item = document.createElement('div');
            item.className = 'key-item';
            item.innerHTML = `
                <span>🔑 Key #${index + 1}: ${maskedKey}</span>
                <button type="button" class="btn-del-key" onclick="deleteKey(${index})">🗑️ លុប</button>
            `;
            display.appendChild(item);
        });
    }

    function addKey() {
        const input = document.getElementById('singleKeyInput');
        const val = input.value.trim();
        if (val && !savedKeys.includes(val)) {
            savedKeys.push(val);
            localStorage.setItem('my_groq_key_array', JSON.stringify(savedKeys));
            input.value = '';
            renderKeyList();
        }
    }

    function deleteKey(index) {
        savedKeys.splice(index, 1);
        localStorage.setItem('my_groq_key_array', JSON.stringify(savedKeys));
        renderKeyList();
    }

    async function step1Translate() {
        const fileInput = document.getElementById('videoFile');
        const btn = document.getElementById('btnTranslate');
        const step2Card = document.getElementById('step2Card');
        const khmerSrtText = document.getElementById('khmerSrtText');

        if (!fileInput.files[0]) return alert("សូមជ្រើសរើស File វីដេអូ!");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('lang', document.getElementById('sourceLang').value);
        formData.append('style', document.getElementById('scriptStyle').value);
        formData.append('api_key', savedKeys.join(','));

        btn.disabled = true;
        btn.innerText = "⏳ កំពុងបំប្លែង និងបកប្រែជាអត្ថបទ Timeline...";

        try {
            const res = await fetch('/get-srt-translation', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (res.ok) {
                khmerSrtText.value = data.khmer_srt;
                step2Card.style.display = 'flex';
                step2Card.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Error: " + (data.error || "មិនអាចបកប្រែបានទេ"));
            }
        } catch (e) {
            alert("Exception: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "📝 1. ស្ដាប់សំឡេង & បង្កើតអត្ថបទ Timeline";
        }
    }

    async function step2DubVideo() {
        const fileInput = document.getElementById('videoFile');
        const btn = document.getElementById('btnDub');
        const khmerSrtText = document.getElementById('khmerSrtText');
        const resultCard = document.getElementById('resultCard');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!khmerSrtText.value.trim()) return alert("មិនមានអត្ថបទ Subtitle ទេ!");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('khmer_srt', khmerSrtText.value);

        btn.disabled = true;
        btn.innerText = "⏳ កំពុងបង្កើតសំឡេងនិយាយ និងតម្រៀបចូលវីដេអូ...";
        resultCard.style.display = 'none';

        try {
            const res = await fetch('/render-dubbed-video', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                const videoBlob = await res.blob();
                const videoUrl = URL.createObjectURL(videoBlob);
                videoPreview.src = videoUrl;
                downloadBtn.href = videoUrl;
                resultCard.style.display = 'flex';
                resultCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                const errData = await res.json();
                alert("Error: " + (errData.error || "មិនអាចបង្កើតវីដេអូបានទេ"));
            }
        } catch (e) {
            alert("Exception: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "🎙️ 2. បង្កើតសំឡេង & បញ្ចូលក្នុងវីដេអូ";
        }
    }
</script>

</body>
</html>
