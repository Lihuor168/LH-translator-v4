<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Auto Video Dubbing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Siemreap', sans-serif, -apple-system, BlinkMacSystemFont;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            text-align: center;
        }

        .header-card h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .header-card p {
            font-size: 13px;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-input-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-input-box:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        input[type="file"] {
            width: 100%;
            font-size: 13px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            display: block;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            background-color: white;
            outline: none;
            transition: border 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: #2563eb;
        }

        .key-input-group {
            display: flex;
            gap: 8px;
        }

        .btn-add-key {
            background: #10b981;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .key-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .btn-del-key {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-submit {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        video {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            background: #000;
        }

        .btn-download {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 12px;
        }

        .btn-download:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>🎬 Khmer AI Video Dubber</h1>
        <p>បំប្លែង • បកប្រែតាម Timeline • បញ្ចូលសំឡេងខ្មែរ Auto</p>
    </div>

    <form id="dubForm" class="card">
        <div>
            <div class="card-title">📤 ជ្រើសរើស File វីដេអូ</div>
            <div class="file-input-box" style="margin-top: 8px;">
                <input type="file" id="videoFile" accept="video/*" required>
            </div>
        </div>

        <div>
            <label>🌐 ភាសាដើមនៃវីដេអូ</label>
            <select id="sourceLang">
                <option value="Chinese" selected>Chinese (ចិន)</option>
                <option value="English">English (អង់គ្លេស)</option>
                <option value="Thai">Thai (ថៃ)</option>
                <option value="Korean">Korean (កូរ៉េ)</option>
            </select>
        </div>

        <div>
            <label>🎙️ ស្ទីលបកប្រែ</label>
            <select id="scriptStyle">
                <option value="សម្រាយរឿង YouTube" selected>សម្រាយរឿង YouTube</option>
                <option value="រឿងនិទាន">រឿងនិទាន</option>
                <option value="ព័ត៌មាន">ព័ត៌មាន</option>
            </select>
        </div>

        <div>
            <label>🔑 Groq API Keys</label>
            <div class="key-input-group">
                <input type="text" id="singleKeyInput" placeholder="gsk_...">
                <button type="button" class="btn-add-key" onclick="addKey()">➕ ថែម Key</button>
            </div>
            <div class="key-list" id="keyListDisplay"></div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
            🎙️ បង្កើតសំឡេង & បញ្ចូលវីដេអូ
        </button>
    </form>

    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">🎉 វីដេអូបកប្រែ និងបញ្ចូលសំឡេងខ្មែររួចរាល់</div>
        <video id="videoPreview" controls></video>
        <a id="downloadBtn" class="btn-download" download="Dubbed_Khmer_Video.mp4">📥 ទាញយក File MP4</a>
    </div>
</div>

<script>
    let savedKeys = JSON.parse(localStorage.getItem('my_groq_key_array') || '[]');

    document.addEventListener('DOMContentLoaded', renderKeyList);

    function renderKeyList() {
        const display = document.getElementById('keyListDisplay');
        display.innerHTML = '';
        savedKeys.forEach((key, index) => {
            const maskedKey = key.substring(0, 8) + '...' + key.substring(key.length - 4);
            const item = document.createElement('div');
            item.className = 'key-item';
            item.innerHTML = `
                <span>🔑 Key #${index + 1}: ${maskedKey}</span>
                <button type="button" class="btn-del-key" onclick="deleteKey(${index})">🗑️ លុប</button>
            `;
            display.appendChild(item);
        });
    }

    function addKey() {
        const input = document.getElementById('singleKeyInput');
        const val = input.value.trim();
        if (val && !savedKeys.includes(val)) {
            savedKeys.push(val);
            localStorage.setItem('my_groq_key_array', JSON.stringify(savedKeys));
            input.value = '';
            renderKeyList();
        }
    }

    function deleteKey(index) {
        savedKeys.splice(index, 1);
        localStorage.setItem('my_groq_key_array', JSON.stringify(savedKeys));
        renderKeyList();
    }

    document.getElementById('dubForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fileInput = document.getElementById('videoFile');
        const submitBtn = document.getElementById('submitBtn');
        const resultCard = document.getElementById('resultCard');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!fileInput.files[0]) return alert("សូមជ្រើសរើស File វីដេអូជាមុនសិន!");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('lang', document.getElementById('sourceLang').value);
        formData.append('style', document.getElementById('scriptStyle').value);
        formData.append('api_key', savedKeys.join(','));

        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ កំពុងដំណើរការបកប្រែ និងបញ្ចូលសំឡេង (អាចប្រែប្រួលតាមទំហំវីដេអូ)...";
        resultCard.style.display = 'none';

        try {
            const response = await fetch('/process-video-dubbing', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const videoBlob = await response.blob();
                const videoUrl = URL.createObjectURL(videoBlob);
                videoPreview.src = videoUrl;
                downloadBtn.href = videoUrl;
                resultCard.style.display = 'flex';
            } else {
                const errData = await response.json();
                alert("កំហុសឆ្គង: " + (errData.error || "មិនអាចដំណើរការបានឡើយ"));
            }
        } catch (err) {
            alert("Exception Error: " + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "🎙️ បង្កើតសំឡេង & បញ្ចូលវីដេអូ";
        }
    });
</script>

</body>
</html>
